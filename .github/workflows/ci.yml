name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: mtg
          POSTGRES_USER: mtg
          POSTGRES_PASSWORD: mtg-local
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U mtg -d mtg"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # The suite creates this database and the recovery and expiry test
      # databases itself; the service's superuser role may create them.
      TEST_DATABASE_URL: postgres://mtg:mtg-local@127.0.0.1:5432/mtg_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            tools/lint/package-lock.json
      - run: npm ci
      - run: npm ci --prefix tools/lint
      - run: npx playwright install --with-deps chromium
      - run: npm run gates
      - run: npm test
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: test-results/
          if-no-files-found: ignore
          retention-days: 7
