services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: mtg
      POSTGRES_USER: mtg
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-mtg-local}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mtg -d mtg"]
      interval: 5s
      timeout: 5s
      retries: 10
  app:
    build: .
    environment:
      DATABASE_URL: postgres://mtg:${POSTGRES_PASSWORD:-mtg-local}@db:5432/mtg
      PORT: 3000
      ROOM_EXPIRY_DAYS: ${ROOM_EXPIRY_DAYS:-30}
      PUBLIC_ORIGIN: ${PUBLIC_ORIGIN:-http://localhost:3000}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      AUTH_DEV_LOGIN: ${AUTH_DEV_LOGIN:-}
    ports:
      - "3000:3000"
    depends_on:
      db:
        condition: service_healthy
volumes:
  postgres-data:
